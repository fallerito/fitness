<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Entrenamiento - Path Personalizado</title>
    <!-- React, ReactDOM, Babel y TailwindCSS vía CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // BASE DE DATOS APUNTANDO A NOMBRES DE ARCHIVO INDIVIDUALES
        const EXERCISES_DATABASE = [
            // PECHO
            { id: 1, name: "Floor Press en Suelo", muscle: "Pecho", type: "reps", duration: 30, value: "12-15 reps", filename: "manc_pecho_1.mp4" },
            { id: 2, name: "Aperturas en Suelo", muscle: "Pecho", type: "reps", duration: 30, value: "12-15 reps", filename: "manc_pecho_2.mp4" },
            { id: 3, name: "Flexiones / Push-ups", muscle: "Pecho", type: "time", duration: 25, value: "25 seg", filename: "body_pecho_1.mp4" },

            // ESPALDA
            { id: 4, name: "Remo a Un Brazo (7.5kg)", muscle: "Espalda", type: "reps", duration: 35, value: "12 reps x lado", filename: "manc_espalda_1.mp4" },
            { id: 5, name: "Remo Inclinado", muscle: "Espalda", type: "reps", duration: 30, value: "12-15 reps", filename: "manc_espalda_2.mp4" },

            // HOMBROS
            { id: 6, name: "Press Militar de Pie", muscle: "Hombro", type: "time", duration: 25, value: "25 seg", filename: "manc_hombro_1.mp4" },
            { id: 7, name: "Elevaciones Laterales", muscle: "Hombro", type: "reps", duration: 30, value: "12-15 reps", filename: "manc_hombro_2.mp4" },

            // PIERNAS
            { id: 8, name: "Sentadilla Goblet", muscle: "Pierna", type: "reps", duration: 30, value: "15 reps Lentas", filename: "manc_pierna_1.mp4" },
            { id: 9, name: "Zancadas / Lunges", muscle: "Pierna", type: "reps", duration: 35, value: "10 reps x pierna", filename: "manc_pierna_2.mp4" },

            // BRAZOS
            { id: 10, name: "Curl de Bíceps", muscle: "Brazos", type: "time", duration: 25, value: "25 seg", filename: "manc_biceps_1.mp4" },
            { id: 11, name: "Curl Martillo", muscle: "Brazos", type: "reps", duration: 30, value: "12 reps", filename: "manc_biceps_2.mp4" },
            { id: 12, name: "Copa de Tríceps a 2 Manos", muscle: "Brazos", type: "reps", duration: 30, value: "12-15 reps", filename: "manc_triceps_1.mp4" }
        ];

        const DAYS_MAP = {
            1: { name: "Lunes", title: "Empuje (Pecho, Hombro, Tríceps)", muscles: ["Pecho", "Hombro", "Brazos"] },
            3: { name: "Miércoles", title: "Tracción (Espalda, Bíceps)", muscles: ["Espalda", "Brazos"] },
            5: { name: "Viernes", title: "Pierna", muscles: ["Pierna"] },
            6: { name: "Sábado", title: "Fullbody Express", muscles: ["Pecho", "Espalda", "Pierna", "Hombro"] }
        };

        // COMPONENTE PARA RENDERIZAR EL VIDEO CON LA RUTA COMPLETA CONSTRUIDA
        const ExerciseVideo = ({ basePath, filename, alt, className }) => {
            const [hasError, setHasError] = React.useState(false);

            // Normalizar el path agregando barra al final si no la tiene
            const cleanPath = basePath.trim();
            const normalizedPath = cleanPath ? (cleanPath.endsWith('/') ? cleanPath : cleanPath + '/') : '';
            const fullSrc = `${normalizedPath}${filename}`;

            React.useEffect(() => {
                setHasError(false);
            }, [fullSrc]);

            if (hasError || !filename) {
                return (
                    <div className={`${className} bg-gray-800 border border-gray-700 flex flex-col items-center justify-center p-2 text-center rounded-lg`}>
                        <span className="text-2xl mb-1">🎬</span>
                        <span className="text-[10px] text-gray-400 font-semibold leading-tight">No encontrado:</span>
                        <span className="text-[9px] text-yellow-500 font-mono break-all">{fullSrc}</span>
                    </div>
                );
            }

            return (
                <video 
                    src={fullSrc} 
                    autoPlay 
                    loop 
                    muted 
                    playsInline 
                    className={`${className} object-cover rounded-lg`} 
                    onError={() => setHasError(true)} 
                />
            );
        };

        function App() {
            // Estado para la ruta donde residen los videos
            const [videoPath, setVideoPath] = React.useState("videos/");

            const [selectedDayIndex, setSelectedDayIndex] = React.useState(() => {
                const today = new Date().getDay();
                return DAYS_MAP[today] ? today : 5;
            });

            const [currentWorkout, setCurrentWorkout] = React.useState([]);
            const [isWorkoutActive, setIsWorkoutActive] = React.useState(false);
            const [currentStepIndex, setCurrentStepIndex] = React.useState(0);
            const [stepTimer, setStepTimer] = React.useState(0);

            const generateWorkoutForDay = (dayIdx) => {
                const dayConfig = DAYS_MAP[dayIdx];
                if (!dayConfig) {
                    setCurrentWorkout([]);
                    return;
                }

                const availableExercises = EXERCISES_DATABASE.filter(ex => 
                    dayConfig.muscles.includes(ex.muscle)
                );

                const shuffled = [...availableExercises].sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, 4);

                const sequence = [];
                for (let round = 1; round <= 3; round++) {
                    selected.forEach((ex) => {
                        sequence.push({
                            ...ex,
                            round: round,
                            stepTitle: `Ronda ${round} de 3 - ${ex.name}`
                        });
                    });
                }
                setCurrentWorkout(sequence);
            };

            React.useEffect(() => {
                generateWorkoutForDay(selectedDayIndex);
            }, [selectedDayIndex]);

            React.useEffect(() => {
                let interval = null;
                if (isWorkoutActive && stepTimer > 0) {
                    interval = setInterval(() => {
                        setStepTimer(prev => prev - 1);
                    }, 1000);
                } else if (isWorkoutActive && stepTimer === 0) {
                    if (currentStepIndex < currentWorkout.length - 1) {
                        const nextIndex = currentStepIndex + 1;
                        setCurrentStepIndex(nextIndex);
                        setStepTimer(currentWorkout[nextIndex].duration);
                    } else {
                        setIsWorkoutActive(false);
                        alert("¡Entrenamiento de 15 minutos completado!");
                    }
                }
                return () => clearInterval(interval);
            }, [isWorkoutActive, stepTimer, currentStepIndex, currentWorkout]);

            const startWorkout = () => {
                if (currentWorkout.length === 0) return;
                setCurrentStepIndex(0);
                setStepTimer(currentWorkout[0].duration);
                setIsWorkoutActive(true);
            };

            const stopWorkout = () => {
                setIsWorkoutActive(false);
            };

            const activeExercise = currentWorkout[currentStepIndex];
            const currentDayName = DAYS_MAP[selectedDayIndex]?.name || "Día de Descanso";

            return (
                <div className="max-w-3xl mx-auto p-4">
                    {/* PANEL DE CONFIGURACIÓN DE RUTA DE VIDEOS */}
                    <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 mb-4 flex flex-col md:flex-row items-center justify-between gap-3">
                        <div className="flex items-center gap-2 w-full md:w-auto">
                            <span className="text-xl">📁</span>
                            <div>
                                <h3 className="text-xs font-bold text-gray-300 uppercase">Carpeta de Videos</h3>
                                <p className="text-[11px] text-gray-400">Ingresa la ruta local donde guardaste los .mp4</p>
                            </div>
                        </div>
                        <div className="w-full md:w-1/2">
                            <input 
                                type="text" 
                                value={videoPath} 
                                onChange={(e) => setVideoPath(e.target.value)}
                                placeholder="Ej: videos/ o C:/MisVideos/"
                                className="w-full bg-gray-900 text-green-400 font-mono text-sm px-3 py-2 rounded border border-gray-700 focus:outline-none focus:border-blue-500"
                            />
                        </div>
                    </div>

                    {/* ENCABEZADO Y SELECCIÓN DE DÍA */}
                    <div className="bg-gray-800 p-5 rounded-xl border border-gray-700 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <span className="text-xs text-blue-400 font-bold uppercase tracking-wider">Día Detectado</span>
                            <h1 className="text-2xl font-bold text-white flex items-center gap-2">
                                📅 {currentDayName} 
                                {DAYS_MAP[new Date().getDay()]?.name === currentDayName && (
                                    <span className="text-xs bg-green-600/30 text-green-400 border border-green-500/30 px-2 py-0.5 rounded-full">HOY</span>
                                )}
                            </h1>
                            <p className="text-sm text-gray-400">
                                {DAYS_MAP[selectedDayIndex]?.title || "Hoy no hay rutina programada."}
                            </p>
                        </div>

                        <div className="flex flex-col items-end">
                            <label className="text-xs text-gray-400 mb-1">Cambiar día manualmente:</label>
                            <select 
                                value={selectedDayIndex} 
                                onChange={(e) => {
                                    setIsWorkoutActive(false);
                                    setSelectedDayIndex(Number(e.target.value));
                                }}
                                className="bg-gray-900 text-white border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-blue-500">
                                <option value={1}>Lunes (Empuje)</option>
                                <option value={3}>Miércoles (Tracción)</option>
                                <option value={5}>Viernes (Pierna)</option>
                                <option value={6}>Sábado (Fullbody)</option>
                            </select>
                        </div>
                    </div>

                    {/* PANTALLA DE ENTRENAMIENTO ACTIVO */}
                    {isWorkoutActive && activeExercise ? (
                        <div className="bg-gray-800 p-6 rounded-xl border border-blue-500 shadow-2xl text-center">
                            <div className="flex justify-between items-center mb-4">
                                <span className="text-xs bg-blue-900 text-blue-200 px-3 py-1 rounded-full font-bold">
                                    Paso {currentStepIndex + 1} de {currentWorkout.length}
                                </span>
                                <span className="text-xs text-yellow-400 font-bold">
                                    {activeExercise.stepTitle}
                                </span>
                            </div>

                            <div className="w-64 h-64 mx-auto rounded-2xl bg-gray-900 p-2 mb-4 border border-gray-700 flex items-center justify-center shadow-inner overflow-hidden">
                                <ExerciseVideo 
                                    basePath={videoPath}
                                    filename={activeExercise.filename} 
                                    alt={activeExercise.name} 
                                    className="w-full h-full"
                                />
                            </div>

                            <h2 className="text-2xl font-bold text-white mb-1">{activeExercise.name}</h2>
                            <p className="text-sm text-gray-400 mb-4">Modalidad: <strong className="text-yellow-400">{activeExercise.value}</strong></p>

                            <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 inline-block w-full max-w-xs mb-4">
                                <span className="text-xs text-gray-400 block mb-1">Siguiente ejercicio en:</span>
                                <span className="text-4xl font-mono font-bold text-green-400">{stepTimer}s</span>
                            </div>

                            <div>
                                <button 
                                    onClick={stopWorkout}
                                    className="bg-red-600 hover:bg-red-500 text-white px-6 py-2 rounded-lg font-bold transition">
                                    Detener Entrenamiento
                                </button>
                            </div>
                        </div>
                    ) : (
                        /* VISTA PREVIA DE LA RUTINA */
                        <div className="bg-gray-800 p-6 rounded-xl border border-gray-700">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-lg font-bold">Ejercicios programados para hoy</h3>
                                {DAYS_MAP[selectedDayIndex] && (
                                    <button 
                                        onClick={startWorkout}
                                        className="bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-xl font-bold transition flex items-center gap-2 shadow-lg">
                                        ▶️ Iniciar Entrenamiento
                                    </button>
                                )}
                            </div>

                            {DAYS_MAP[selectedDayIndex] ? (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {currentWorkout.slice(0, 4).map((ex, idx) => (
                                        <div key={idx} className="bg-gray-900 p-3 rounded-lg border border-gray-800 flex gap-3 items-center">
                                            <div className="w-16 h-16 rounded-lg bg-gray-800 p-1 flex-shrink-0 flex items-center justify-center border border-gray-700 overflow-hidden">
                                                <ExerciseVideo 
                                                    basePath={videoPath}
                                                    filename={ex.filename} 
                                                    alt={ex.name} 
                                                    className="w-full h-full"
                                                />
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-sm">{ex.name}</h4>
                                                <span className="text-xs text-gray-400 block">{ex.muscle}</span>
                                                <span className="text-xs text-orange-400 font-semibold">{ex.value}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="text-center py-8 text-gray-400">
                                    <p>Hoy es día de descanso activo. Puedes seleccionar otro día en el menú superior.</p>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
