<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador Workout</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            color: var(--accent);
            margin-top: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .video-container {
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid #334155;
            aspect-ratio: 16 / 9;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .timer-display {
            background: #090d16;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #334155;
        }

        .countdown-title {
            color: var(--text-sub);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .time-remaining {
            font-size: 4.5rem;
            font-weight: bold;
            font-family: monospace;
            color: #38bdf8;
            line-height: 1;
        }

        .round-info {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-start { background: var(--accent-green); color: white; }
        .btn-pause { background: var(--accent); color: black; }
        .btn-reset { background: var(--accent-red); color: white; }

        audio { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>WORKOUT SESSION</h1>

    <div class="video-container">
        <video id="videoPlayer" muted playsinline></video>
    </div>

    <div class="timer-display">
        <div class="countdown-title">Tiempo Restante de la Sesión</div>
        <div class="time-remaining" id="countdown">15:00</div>
        <div class="round-info" id="roundDisplay">Listo para comenzar</div>
    </div>

    <div class="controls">
        <button class="btn-start" onclick="startTimer()">Iniciar</button>
        <button class="btn-pause" onclick="pauseTimer()">Pausar</button>
        <button class="btn-reset" onclick="resetTimer()">Reiniciar</button>
    </div>

    <audio id="audioPlayer"></audio>
</div>

<script>
    // LISTA DE VÍDEOS DE EJERCICIOS
    const listaVideos = [
        "body_pecho_01.mp4",
        "body_espalda_01.mp4",
        "body_piernas_01.mp4",
        "body_hombros_01.mp4",
        "body_abs_01.mp4"
    ];

    // MÚSICA EN CARPETA /musica/
    const libreriaMusica = [
        "pista1.mp3",
        "pista2.mp3",
        "pista3.mp3",
        "pista4.mp3",
        "pista5.mp3"
    ];

    // Parámetros de tiempo
    const tiempoPorEjercicioSegundos = 25; // Cada ejercicio dura 25 segundos
    const totalDurationSeconds = 15 * 60;   // 15 minutos totales
    
    let remainingTime = totalDurationSeconds;
    let timerInterval = null;
    let isRunning = false;
    let currentVideoIndex = 0;
    let videoTimeCounter = 0;

    const countdownEl = document.getElementById('countdown');
    const roundDisplayEl = document.getElementById('roundDisplay');
    const audioPlayer = document.getElementById('audioPlayer');
    const videoPlayer = document.getElementById('videoPlayer');

    // Cargar y asegurar la reproducción del vídeo actual
    function cargarVideoActual() {
        if (listaVideos.length === 0) return;
        
        const videoName = listaVideos[currentVideoIndex];
        videoPlayer.pause();
        videoPlayer.src = `videos/${videoName}`;
        videoPlayer.load();

        // Reproducir únicamente cuando el navegador haya cargado los datos del vídeo
        videoPlayer.onloadeddata = () => {
            if (isRunning) {
                videoPlayer.play().catch(e => console.log("Error al reproducir vídeo:", e));
            }
        };
    }

    // Reinicia el vídeo actual si es más corto que la duración del ejercicio (bucle)
    videoPlayer.onended = () => {
        if (isRunning) {
            videoPlayer.currentTime = 0;
            videoPlayer.play().catch(e => console.log("Error en bucle de vídeo:", e));
        }
    };

    // Pasa al siguiente ejercicio de la lista al cumplir los 25 segundos
    function cambiarSiguienteEjercicio() {
        if (listaVideos.length === 0) return;
        currentVideoIndex = (currentVideoIndex + 1) % listaVideos.length;
        videoTimeCounter = 0;
        cargarVideoActual();
    }

    function reproducirMusicaAleatoria() {
        if (libreriaMusica.length === 0) return;

        const indexAleatorio = Math.floor(Math.random() * libreriaMusica.length);
        const archivoSeleccionado = libreriaMusica[indexAleatorio];
        
        audioPlayer.src = `musica/${archivoSeleccionado}`;
        audioPlayer.play().catch(e => console.log("Aviso de audio:", e));
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function updateDisplay() {
        countdownEl.textContent = formatTime(remainingTime);
    }

    function startTimer() {
        if (isRunning) return;
        isRunning = true;

        if (!videoPlayer.src || videoPlayer.src === "") {
            cargarVideoActual();
        } else {
            videoPlayer.play().catch(e => console.log("Error al reanudar vídeo:", e));
        }

        if (remainingTime === totalDurationSeconds || audioPlayer.paused) {
            reproducirMusicaAleatoria();
        }

        roundDisplayEl.textContent = "¡Sesión en Curso!";

        timerInterval = setInterval(() => {
            if (remainingTime > 0) {
                remainingTime--;
                videoTimeCounter++;

                // Cambiar de ejercicio cada 25 segundos
                if (videoTimeCounter >= tiempoPorEjercicioSegundos) {
                    cambiarSiguienteEjercicio();
                }

                updateDisplay();
            } else {
                clearInterval(timerInterval);
                isRunning = false;
                roundDisplayEl.textContent = "¡Entrenamiento Finalizado!";
                audioPlayer.pause();
                videoPlayer.pause();
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerInterval);
        isRunning = false;
        roundDisplayEl.textContent = "Sesión Pausada";
        audioPlayer.pause();
        videoPlayer.pause();
    }

    function resetTimer() {
        clearInterval(timerInterval);
        isRunning = false;
        remainingTime = totalDurationSeconds;
        currentVideoIndex = 0;
        videoTimeCounter = 0;
        updateDisplay();
        roundDisplayEl.textContent = "Listo para comenzar";
        
        audioPlayer.pause();
        audioPlayer.currentTime = 0;

        videoPlayer.pause();
        videoPlayer.removeAttribute('src');
        videoPlayer.load();
    }

    updateDisplay();
</script>

</body>
</html>
