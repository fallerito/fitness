<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Session Automática - App Dinámica</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // BASE DE DATOS DE EJERCICIOS
        const EXERCISES_DATABASE = [
            { id: 1, name: "Floor Press en Suelo", muscle: "Pecho", filename: "manc_pecho_01.mp4" },
            { id: 2, name: "Aperturas en Suelo", muscle: "Pecho", filename: "manc_pecho_02.mp4" },
            { id: 3, name: "Flexiones / Push-ups", muscle: "Pecho", filename: "body_pecho_01.mp4" },
            { id: 4, name: "Remo a Un Brazo (7.5kg)", muscle: "Espalda", filename: "manc_espalda_01.mp4" },
            { id: 5, name: "Remo Inclinado", muscle: "Espalda", filename: "manc_espalda_02.mp4" },
            { id: 6, name: "Press Militar de Pie", muscle: "Hombro", filename: "manc_hombro_01.mp4" },
            { id: 7, name: "Elevaciones Laterales", muscle: "Hombro", filename: "manc_hombro_02.mp4" },
            { id: 8, name: "Sentadilla Goblet", muscle: "Pierna", filename: "manc_pierna_01.mp4" },
            { id: 9, name: "Zancadas / Lunges", muscle: "Pierna", filename: "manc_pierna_02.mp4" },
            { id: 10, name: "Curl de Bíceps", muscle: "Brazos", filename: "manc_biceps_01.mp4" },
            { id: 11, name: "Curl Martillo", muscle: "Brazos", filename: "manc_biceps_02.mp4" },
            { id: 12, name: "Copa de Tríceps a 2 Manos", muscle: "Brazos", filename: "manc_triceps_01.mp4" }
        ];

        // CONFIGURACIÓN DE DÍAS
        const DAYS_MAP = {
            1: { name: "Lunes", title: "Empuje + Hombro Mixto", primaryMuscles: ["Pecho", "Hombro", "Brazos"] },
            3: { name: "Miércoles", title: "Tracción + Pierna Híbrida", primaryMuscles: ["Espalda", "Pierna", "Brazos"] },
            5: { name: "Viernes", title: "Fullbody Dinámico", primaryMuscles: ["Pecho", "Espalda", "Pierna"] },
            6: { name: "Sábado", title: "Burnout Express", primaryMuscles: ["Hombro", "Brazos", "Pierna"] }
        };

        // PISTAS MP3 ASIGNADAS A CADA BLOQUE DE LA SESIÓN
        // track_01.mp3 -> Bloque Estándar
        // track_02.mp3 -> Serie Única y Descansos
        // track_03.mp3 -> MiniSets y Burnout Final
        const MUSIC_TRACKS = {
            block1: "musica/track_01.mp3",
            block2: "musica/track_02.mp3",
            block3: "musica/track_03.mp3"
        };

        // COMPONENTE DE VIDEO
        const ExerciseVideo = ({ filename, className }) => {
            const [hasError, setHasError] = React.useState(false);
            const fullSrc = `videos/${filename}`;

            React.useEffect(() => {
                setHasError(false);
            }, [fullSrc]);

            if (hasError || !filename) {
                return (
                    <div className={`${className} bg-gray-800 border border-gray-700 flex flex-col items-center justify-center p-2 text-center rounded-lg`}>
                        <span className="text-xl mb-1">🎬</span>
                        <span className="text-[10px] text-gray-400 font-semibold leading-tight">No encontrado</span>
                    </div>
                );
            }

            return (
                <video 
                    src={fullSrc} 
                    autoPlay 
                    loop 
                    muted 
                    playsInline 
                    className={`${className} object-cover rounded-lg`} 
                    onError={() => setHasError(true)} 
                />
            );
        };

        function App() {
            const [selectedDayIndex, setSelectedDayIndex] = React.useState(() => {
                const today = new Date().getDay();
                return DAYS_MAP[today] ? today : 5;
            });

            const [currentWorkout, setCurrentWorkout] = React.useState([]);
            const [isWorkoutActive, setIsWorkoutActive] = React.useState(false);
            const [currentStepIndex, setCurrentStepIndex] = React.useState(0);
            const [stepTimer, setStepTimer] = React.useState(0);
            const [totalSessionTime, setTotalSessionTime] = React.useState(0);

            // REFERENCIA AL AUDIO OCULTO
            const audioRef = React.useRef(null);
            const [currentMusicSrc, setCurrentMusicSrc] = React.useState(MUSIC_TRACKS.block1);

            // Generador de rutina exacta de 15 minutos (900s) con etiquetas de bloque para la música
            const generateWorkoutForDay = (dayIdx) => {
                const dayConfig = DAYS_MAP[dayIdx];
                if (!dayConfig) {
                    setCurrentWorkout([]);
                    setTotalSessionTime(0);
                    return;
                }

                const pool = EXERCISES_DATABASE.filter(ex => dayConfig.primaryMuscles.includes(ex.muscle));
                const shuffled = [...pool].sort(() => 0.5 - Math.random());
                if (shuffled.length < 4) return;

                const stdEx1 = shuffled[0];
                const stdEx2 = shuffled[1];
                const singleEx = shuffled[2];
                const miniSetGroup = shuffled.slice(0, 4);

                const exactSequence = [
                    // BLOQUE 1 (Usa track_01.mp3)
                    { ...stdEx1, mode: "Estándar", duration: 40, value: "12 reps", isRest: false, musicBlock: 'block1' },
                    { ...stdEx2, mode: "Estándar", duration: 40, value: "12 reps", isRest: false, musicBlock: 'block1' },
                    { ...stdEx1, mode: "Estándar", duration: 40, value: "12 reps", isRest: false, musicBlock: 'block1' },
                    { ...stdEx2, mode: "Estándar", duration: 40, value: "12 reps", isRest: false, musicBlock: 'block1' },
                    { ...stdEx1, mode: "Estándar", duration: 40, value: "12 reps", isRest: false, musicBlock: 'block1' },
                    { ...stdEx2, mode: "Estándar", duration: 40, value: "12 reps", isRest: false, musicBlock: 'block1' },
                    
                    // BLOQUE 2 (Usa track_02.mp3)
                    { name: "Descanso Activo", muscle: "Pausa", filename: "", mode: "Descanso", duration: 30, value: "Recupera aire", isRest: true, musicBlock: 'block2' },
                    { ...singleEx, mode: "Serie Única Máxima", duration: 60, value: "Fallo muscular", isRest: false, musicBlock: 'block2' },
                    { name: "Descanso Activo", muscle: "Pausa", filename: "", mode: "Descanso", duration: 30, value: "Baja pulsaciones", isRest: true, musicBlock: 'block2' },

                    // BLOQUE 3 (Usa track_03.mp3)
                    { ...miniSetGroup[0], mode: "MiniSet R1", duration: 45, value: "Continuo", isRest: false, musicBlock: 'block3' },
                    { ...miniSetGroup[1], mode: "MiniSet R1", duration: 45, value: "Continuo", isRest: false, musicBlock: 'block3' },
                    { ...miniSetGroup[2], mode: "MiniSet R1", duration: 45, value: "Continuo", isRest: false, musicBlock: 'block3' },
                    { ...miniSetGroup[3], mode: "MiniSet R1", duration: 45, value: "Continuo", isRest: false, musicBlock: 'block3' },
                    { name: "Descanso Intermedio", muscle: "Pausa", filename: "", mode: "Descanso", duration: 30, value: "Respiración profunda", isRest: true, musicBlock: 'block3' },
                    { ...miniSetGroup[0], mode: "MiniSet R2", duration: 45, value: "A tope", isRest: false, musicBlock: 'block3' },
                    { ...miniSetGroup[1], mode: "MiniSet R2", duration: 45, value: "A tope", isRest: false, musicBlock: 'block3' },
                    { ...miniSetGroup[2], mode: "MiniSet R2", duration: 45, value: "A tope", isRest: false, musicBlock: 'block3' },
                    { ...miniSetGroup[3], mode: "MiniSet R2", duration: 45, value: "A tope", isRest: false, musicBlock: 'block3' },
                    { name: "Descanso Final", muscle: "Pausa", filename: "", mode: "Descanso", duration: 30, value: "Último respiro", isRest: true, musicBlock: 'block3' },
                    { ...shuffled[3], mode: "Burnout Final", duration: 60, value: "¡Todo lo que te queda!", isRest: false, musicBlock: 'block3' }
                ];

                setCurrentWorkout(exactSequence);
                const totalSecs = exactSequence.reduce((acc, curr) => acc + curr.duration, 0);
                setTotalSessionTime(totalSecs);
            };

            React.useEffect(() => {
                generateWorkoutForDay(selectedDayIndex);
            }, [selectedDayIndex]);

            // Gestionar cambios de pista automáticos al cambiar de paso/bloque
            React.useEffect(() => {
                if (isWorkoutActive && currentWorkout[currentStepIndex]) {
                    const currentBlock = currentWorkout[currentStepIndex].musicBlock;
                    const targetMusic = MUSIC_TRACKS[currentBlock];

                    if (currentMusicSrc !== targetMusic) {
                        setCurrentMusicSrc(targetMusic);
                    }

                    if (audioRef.current) {
                        audioRef.current.volume = 0.7;
                        audioRef.current.play().catch(e => console.log("Audio autoplay restricted:", e));
                    }
                }
            }, [currentStepIndex, isWorkoutActive]);

            // Temporizador general de sesión
            React.useEffect(() => {
                let interval = null;
                if (isWorkoutActive && stepTimer > 0) {
                    interval = setInterval(() => {
                        setStepTimer(prev => prev - 1);
                        setTotalSessionTime(prev => (prev > 0 ? prev - 1 : 0));
                    }, 1000);
                } else if (isWorkoutActive && stepTimer === 0) {
                    if (currentStepIndex < currentWorkout.length - 1) {
                        const nextIndex = currentStepIndex + 1;
                        setCurrentStepIndex(nextIndex);
                        setStepTimer(currentWorkout[nextIndex].duration);
                    } else {
                        setIsWorkoutActive(false);
                        if (audioRef.current) audioRef.current.pause();
                        alert("¡WORKOUT SESSION Completada con éxito!");
                    }
                }
                return () => clearInterval(interval);
            }, [isWorkoutActive, stepTimer, currentStepIndex, currentWorkout]);

            const startWorkout = () => {
                if (currentWorkout.length === 0) return;
                setCurrentStepIndex(0);
                setStepTimer(currentWorkout[0].duration);
                setCurrentMusicSrc(MUSIC_TRACKS[currentWorkout[0].musicBlock]);
                setIsWorkoutActive(true);

                // Forzar reproducción inicial del audio
                setTimeout(() => {
                    if (audioRef.current) {
                        audioRef.current.currentTime = 0;
                        audioRef.current.volume = 0.7;
                        audioRef.current.play().catch(e => console.log("Audio play blocked:", e));
                    }
                }, 100);
            };

            const stopWorkout = () => {
                setIsWorkoutActive(false);
                if (audioRef.current) {
                    audioRef.current.pause();
                }
                generateWorkoutForDay(selectedDayIndex);
            };

            const formatMinutes = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            const activeExercise = currentWorkout[currentStepIndex];
            const currentDayName = DAYS_MAP[selectedDayIndex]?.name || "Día de Descanso";

            return (
                <div className="max-w-3xl mx-auto p-4">
                    {/* AUDIO OCULTO AUTOMÁTICO */}
                    <audio ref={audioRef} src={currentMusicSrc} loop />

                    {/* CARTEL DE CABECERA: WORKOUT SESSION */}
                    <div className="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 p-6 rounded-2xl shadow-xl mb-6 text-center border border-blue-400/30">
                        <span className="text-xs uppercase tracking-widest text-blue-200 font-bold">Programa Oficial de Rendimiento</span>
                        <h1 className="text-3xl md:text-4xl font-black text-white tracking-wider mt-1 drop-shadow-md">
                            WORKOUT SESSION
                        </h1>
                        <p className="text-xs text-indigo-100 mt-1">Duración optimizada: <strong className="text-yellow-300">15 Minutos</strong> con audio automático por bloques</p>
                    </div>

                    {/* SELECCIÓN DE DÍA */}
                    <div className="bg-gray-800 p-5 rounded-xl border border-gray-700 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <span className="text-xs text-blue-400 font-bold uppercase tracking-wider">Día Detectado</span>
                            <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                📅 {currentDayName} 
                                {DAYS_MAP[new Date().getDay()]?.name === currentDayName && (
                                    <span className="text-xs bg-green-600/30 text-green-400 border border-green-500/30 px-2 py-0.5 rounded-full">HOY</span>
                                )}
                            </h2>
                            <p className="text-sm text-gray-400">
                                {DAYS_MAP[selectedDayIndex]?.title || "Hoy no hay rutina programada."}
                            </p>
                        </div>

                        <div className="flex flex-col items-end">
                            <label className="text-xs text-gray-400 mb-1">Cambiar día manualmente:</label>
                            <select 
                                value={selectedDayIndex} 
                                onChange={(e) => {
                                    setIsWorkoutActive(false);
                                    setSelectedDayIndex(Number(e.target.value));
                                }}
                                className="bg-gray-900 text-white border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-blue-500">
                                <option value={1}>Lunes (Empuje + Hombro)</option>
                                <option value={3}>Miércoles (Tracción + Pierna)</option>
                                <option value={5}>Viernes (Fullbody Dinámico)</option>
                                <option value={6}>Sábado (Burnout Express)</option>
                            </select>
                        </div>
                    </div>

                    {/* PANTALLA DE ENTRENAMIENTO EN EJECUCIÓN */}
                    {isWorkoutActive && activeExercise ? (
                        <div className={`p-6 rounded-xl border shadow-2xl text-center ${activeExercise.isRest ? 'bg-blue-950/40 border-blue-400' : 'bg-gray-800 border-blue-500'}`}>
                            <div className="flex justify-between items-center mb-4">
                                <span className="text-xs bg-blue-900 text-blue-200 px-3 py-1 rounded-full font-bold">
                                    Paso {currentStepIndex + 1} de {currentWorkout.length}
                                </span>
                                <span className="text-xs bg-purple-900 text-purple-200 px-3 py-1 rounded-full font-bold">
                                    ⏱️ Sesión Restante: {formatMinutes(totalSessionTime)}
                                </span>
                                <span className={`text-xs px-3 py-1 rounded-full font-bold ${activeExercise.isRest ? 'bg-blue-600 text-white' : 'bg-yellow-900/60 text-yellow-300 border border-yellow-500/30'}`}>
                                    {activeExercise.mode}
                                </span>
                            </div>

                            {!activeExercise.isRest ? (
                                <div className="w-64 h-64 mx-auto rounded-2xl bg-gray-900 p-2 mb-4 border border-gray-700 flex items-center justify-center shadow-inner overflow-hidden">
                                    <ExerciseVideo filename={activeExercise.filename} className="w-full h-full" />
                                </div>
                            ) : (
                                <div className="w-64 h-64 mx-auto rounded-2xl bg-blue-900/20 p-2 mb-4 border border-blue-500/50 flex flex-col items-center justify-center shadow-inner">
                                    <span className="text-5xl mb-2">🧘‍♂️</span>
                                    <span className="text-blue-300 font-bold text-lg">TIEMPO DE DESCANSO</span>
                                    <span className="text-xs text-blue-200 mt-1">Recupera el aliento e hidrátate</span>
                                </div>
                            )}

                            <h2 className="text-2xl font-bold text-white mb-1">{activeExercise.name}</h2>
                            <p className="text-xs text-gray-400 mb-1">Bloque: <strong className="text-blue-400">{activeExercise.muscle}</strong></p>
                            <p className="text-sm text-gray-300 mb-4">Indicación: <strong className="text-yellow-400">{activeExercise.value}</strong></p>

                            <div className="bg-gray-900 p-4 rounded-xl border border-gray-700 inline-block w-full max-w-xs mb-4">
                                <span className="text-xs text-gray-400 block mb-1">{activeExercise.isRest ? 'Tiempo de descanso restante:' : 'Tiempo de ejecución:'}</span>
                                <span className={`text-4xl font-mono font-bold ${activeExercise.isRest ? 'text-blue-400' : 'text-green-400'}`}>{stepTimer}s</span>
                            </div>

                            <div>
                                <button 
                                    onClick={stopWorkout}
                                    className="bg-red-600 hover:bg-red-500 text-white px-6 py-2 rounded-lg font-bold transition">
                                    Detener Entrenamiento
                                </button>
                            </div>
                        </div>
                    ) : (
                        /* VISTA PREVIA DE LA RUTINA DEL DÍA */
                        <div className="bg-gray-800 p-6 rounded-xl border border-gray-700">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                                <div>
                                    <h3 className="text-lg font-bold">Secuencia de 15 Minutos Programada</h3>
                                    <span className="text-xs text-gray-400 block">Duración Total Exacta: <strong className="text-green-400">{formatMinutes(totalSessionTime)} min</strong> (Con música automática por bloques)</span>
                                </div>
                                {DAYS_MAP[selectedDayIndex] && (
                                    <button 
                                        onClick={startWorkout}
                                        className="bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-xl font-bold transition flex items-center gap-2 shadow-lg">
                                        ▶️ Iniciar Workout Session
                                    </button>
                                )}
                            </div>

                            {DAYS_MAP[selectedDayIndex] ? (
                                <div className="space-y-3">
                                    {currentWorkout.map((ex, idx) => (
                                        <div key={idx} className={`p-3 rounded-lg border flex justify-between items-center gap-3 ${ex.isRest ? 'bg-blue-950/20 border-blue-900/50' : 'bg-gray-900 border-gray-800'}`}>
                                            <div className="flex items-center gap-3">
                                                {!ex.isRest ? (
                                                    <div className="w-12 h-12 rounded bg-gray-800 p-1 flex-shrink-0 border border-gray-700 overflow-hidden">
                                                        <ExerciseVideo filename={ex.filename} className="w-full h-full" />
                                                    </div>
                                                ) : (
                                                    <div className="w-12 h-12 rounded bg-blue-900/30 p-1 flex-shrink-0 border border-blue-700/50 flex items-center justify-center text-blue-300 font-bold text-xs">
                                                        💤
                                                    </div>
                                                )}
                                                <div>
                                                    <h4 className="font-bold text-sm">{ex.name}</h4>
                                                    <span className="text-xs text-gray-400">{ex.muscle} • {ex.value} • <strong className="text-green-400">{ex.duration}s</strong></span>
                                                </div>
                                            </div>
                                            <span className={`text-[11px] border px-2 py-1 rounded font-semibold whitespace-nowrap ${ex.isRest ? 'bg-blue-950 text-blue-300 border-blue-800' : 'bg-gray-800 text-yellow-400 border-gray-700'}`}>
                                                {ex.mode}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="text-center py-8 text-gray-400">
                                    <p>Hoy es día de descanso activo. Selecciona otro día en el menú superior.</p>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
