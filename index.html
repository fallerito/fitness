<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            color: var(--accent);
            margin-top: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer-display {
            background: #090d16;
            border-radius: 10px;
            padding: 25px 20px;
            margin: 20px 0;
            border: 2px solid #334155;
        }

        .countdown-title {
            color: var(--text-sub);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .time-remaining {
            font-size: 4.5rem;
            font-weight: bold;
            font-family: monospace;
            color: #38bdf8;
            line-height: 1;
        }

        .round-info {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .music-card {
            background: #131d31;
            border-left: 4px solid var(--accent-green);
            border-radius: 6px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
        }

        .music-title {
            color: var(--accent-green);
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .music-track-name {
            font-size: 1.1rem;
            color: #ffffff;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-start {
            background: var(--accent-green);
            color: white;
        }

        .btn-pause {
            background: var(--accent);
            color: black;
        }

        .btn-reset {
            background: var(--accent-red);
            color: white;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Fitboxing Session</h1>

    <!-- Solo muestra tiempo restante (Cuenta Atrás) -->
    <div class="timer-display">
        <div class="countdown-title">Tiempo Restante</div>
        <div class="time-remaining" id="countdown">15:00</div>
        <div class="round-info" id="roundDisplay">Listo para comenzar</div>
    </div>

    <!-- Pista asignada aleatoriamente -->
    <div class="music-card">
        <div class="music-title">🎵 Pista Asignada Aleatoriamente:</div>
        <div class="music-track-name" id="currentTrackDisplay">En espera...</div>
    </div>

    <div class="controls">
        <button class="btn-start" onclick="startTimer()">Iniciar</button>
        <button class="btn-pause" onclick="pauseTimer()">Pausar</button>
        <button class="btn-reset" onclick="resetTimer()">Reiniciar</button>
    </div>

    <audio id="audioPlayer"></audio>
</div>

<script>
    // Tu lista de canciones guardadas
    const playlist = [
        { name: "Canción 1 (Electro House - 135 BPM)", src: "cancion1.mp3" },
        { name: "Canción 2 (Synthwave - 140 BPM)", src: "cancion2.mp3" },
        { name: "Canción 3 (Drum & Bass - 145 BPM)", src: "cancion3.mp3" },
        { name: "Canción 4 (Trap Motivacional - 130 BPM)", src: "cancion4.mp3" },
        { name: "Canción 5 (High Energy EDM - 150 BPM)", src: "cancion5.mp3" }
    ];

    const totalDurationSeconds = 15 * 60; // Duración total (ej. 15 min)
    let remainingTime = totalDurationSeconds;
    let timerInterval = null;
    let isRunning = false;

    const countdownEl = document.getElementById('countdown');
    const roundDisplayEl = document.getElementById('roundDisplay');
    const trackDisplayEl = document.getElementById('currentTrackDisplay');
    const audioPlayer = document.getElementById('audioPlayer');

    // Selección aleatoria de música
    function getRandomTrack() {
        const randomIndex = Math.floor(Math.random() * playlist.length);
        return playlist[randomIndex];
    }

    function playRandomMusic() {
        const track = getRandomTrack();
        trackDisplayEl.textContent = track.name;
        
        if (track.src) {
            audioPlayer.src = track.src;
            audioPlayer.play().catch(e => console.log("Reproducción automática pendiente de interacción."));
        }
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function updateDisplay() {
        countdownEl.textContent = formatTime(remainingTime);
    }

    function startTimer() {
        if (isRunning) return;
        isRunning = true;

        if (remainingTime === totalDurationSeconds || audioPlayer.paused) {
            playRandomMusic();
        }

        roundDisplayEl.textContent = "¡Sesión en Curso!";

        timerInterval = setInterval(() => {
            if (remainingTime > 0) {
                remainingTime--;
                updateDisplay();
            } else {
                clearInterval(timerInterval);
                isRunning = false;
                roundDisplayEl.textContent = "¡Entrenamiento Finalizado!";
                audioPlayer.pause();
            }
        }, 1000);
    }

    function pauseTimer() {
        clearInterval(timerInterval);
        isRunning = false;
        roundDisplayEl.textContent = "Sesión Pausada";
        audioPlayer.pause();
    }

    function resetTimer() {
        clearInterval(timerInterval);
        isRunning = false;
        remainingTime = totalDurationSeconds;
        updateDisplay();
        roundDisplayEl.textContent = "Listo para comenzar";
        trackDisplayEl.textContent = "En espera...";
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
    }

    updateDisplay();
</script>

</body>
</html>
