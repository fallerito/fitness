        const generateDatabaseFromFiles = () => {
            return RAW_VIDEOS_LIST.map((filename, index) => {
                const parts = filename.replace('.mp4', '').split('_');
                const toolType = parts[0] === 'body' ? 'Bodyweight' : 'Dumbbell';
                let rawMuscle = parts[1] || 'General';
                
                if (rawMuscle === 'culo') rawMuscle = 'gluteo';

                let mappedMuscle = rawMuscle.charAt(0).toUpperCase() + rawMuscle.slice(1);
                if (rawMuscle === 'gluteo') mappedMuscle = 'Legs';
                if (rawMuscle === 'abdominal') mappedMuscle = 'Core';
                if (rawMuscle === 'cuello' || rawMuscle === 'lateral') mappedMuscle = 'Fullbody';

                const formattedName = `${toolType} ${rawMuscle.toUpperCase()} #${parts[2] || '1'}`;

                return {
                    id: index + 1,
                    name: formattedName,
                    muscle: mappedMuscle,
                    rawMuscle: rawMuscle,
                    filename: filename,
                    tool: toolType
                };
            });
        };

        const EXERCISES_DATABASE = generateDatabaseFromFiles();

            {

        const ExerciseVideo = ({ filename, className }) => {

                    </div>
                );
            }

            return (
                <video 
                    src={fullSrc} 
                    autoPlay 
                    loop 
                    muted 
                    playsInline 
                    className={`${className} object-cover rounded-lg`} 
                    onError={() => setHasError(true)} 
                />
            );
        };

        function App() {
            const [selectedFighter, setSelectedFighter] = React.useState("Flat");
            const [difficultyMode, setDifficultyMode] = React.useState("Guerrero");
            
            // Estado para alternar entre el Workout normal y el Módulo de Patadas
            const [activeTab, setActiveTab] = React.useState("main"); // "main" o "tkd_program"
            const [selectedWeek, setSelectedWeek] = React.useState(1);

            // Cloud Sync (JSONBin.io) config
            const [cloudBinId, setCloudBinId] = React.useState(() => localStorage.getItem('jeongsin_cloud_bin_id') || '');
            const [cloudApiKey, setCloudApiKey] = React.useState(() => localStorage.getItem('jeongsin_cloud_api_key') || '');
            const [showCloudModal, setShowCloudModal] = React.useState(false);
            const [isSyncing, setIsSyncing] = React.useState(false);

            const [userStats, setUserStats] = React.useState(() => {
                const saved = localStorage.getItem('jeongsin_user_stats');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed && typeof parsed === 'object') {
                            return {
                                Flat: Number(parsed.Flat) || 0,
                                Random: Number(parsed.Random) || 0,
                                Invitado: Number(parsed.Invitado) || 0
                            };
                        }
                    } catch (e) {}
                }
                return { Flat: 0, Random: 0, Invitado: 0 };
            });

            const [selectedDayIndex, setSelectedDayIndex] = React.useState(() => {
                const today = new Date().getDay();
                return DAYS_MAP[today] ? today : 5;
            });

            const [currentWorkout, setCurrentWorkout] = React.useState([]);
            const [isWorkoutActive, setIsWorkoutActive] = React.useState(false);
            const [isPaused, setIsPaused] = React.useState(false);
            const [isCompleted, setIsCompleted] = React.useState(false);
            const [currentStepIndex, setCurrentStepIndex] = React.useState(0);
            
            const [isCountdownActive, setIsCountdownActive] = React.useState(false);
            const [countdownTimer, setCountdownTimer] = React.useState(5);
            const [stepTimer, setStepTimer] = React.useState(0);
            const [totalSessionTime, setTotalSessionTime] = React.useState(0);
            
            const [currentTrack, setCurrentTrack] = React.useState("pista1.mp3");
            const [selectedQuote, setSelectedQuote] = React.useState(MILITARY_QUOTES[0]);

            const audioRef = React.useRef(null);
            const audioCtxRef = React.useRef(null);

            const saveStatsToStorage = (newStats) => {
                setUserStats(newStats);
                localStorage.setItem('jeongsin_user_stats', JSON.stringify(newStats));
                if (cloudBinId) {
                    syncToCloud(newStats, cloudBinId, cloudApiKey);
                }
            };

            const syncToCloud = async (statsToSync, binId, apiKey) => {
                if (!binId) return;
                try {
                    setIsSyncing(true);
                    const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(apiKey ? { 'X-Master-Key': apiKey } : {})
                        },
                        body: JSON.stringify({ stats: statsToSync, updatedAt: new Date().toISOString() })
                    });
                    if (!response.ok) console.error("Error syncing to cloud");
                } catch (e) {
                    console.error("Cloud sync exception:", e);
                } finally {
                    setIsSyncing(false);
                }
            };

            const fetchFromCloud = async () => {
                if (!cloudBinId) return;
                try {
                    setIsSyncing(true);
                    const response = await fetch(`https://api.jsonbin.io/v3/b/${cloudBinId}/latest`, {
                        headers: {
                            ...(cloudApiKey ? { 'X-Master-Key': cloudApiKey } : {})
                        }
                    });
                    if (response.ok) {
                        const data = await response.json();
                        const remoteStats = data.record?.stats;
                        if (remoteStats) {
                            const cleaned = {
                                Flat: Number(remoteStats.Flat) || 0,
                                Random: Number(remoteStats.Random) || 0,
                                Invitado: Number(remoteStats.Invitado) || 0
                            };
                            setUserStats(cleaned);
                            localStorage.setItem('jeongsin_user_stats', JSON.stringify(cleaned));
                            alert("¡Puntuaciones sincronizadas desde la nube con éxito!");
                        }
                    } else {
                        alert("No se pudo conectar con el Bin ID proporcionado.");
                    }
                } catch (e) {
                    console.error("Fetch cloud exception:", e);
                    alert("Error al conectar con la nube.");
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleSaveCloudConfig = (e) => {
                e.preventDefault();
                localStorage.setItem('jeongsin_cloud_bin_id', cloudBinId);
                localStorage.setItem('jeongsin_cloud_api_key', cloudApiKey);
                setShowCloudModal(false);
                if (cloudBinId) {
                    fetchFromCloud();
                }
            };

            const recordSessionCompletion = () => {
                const pointsToAdd = DIFFICULTIES_CONFIG[difficultyMode]?.points || 1;
                const updated = {
                    ...userStats,
                    [selectedFighter]: (userStats[selectedFighter] || 0) + pointsToAdd
                };
                saveStatsToStorage(updated);
            };

            const playBeep = (isFinal = false) => {
                try {
                    if (!audioCtxRef.current) {
                        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    const ctx = audioCtxRef.current;
                    if (ctx.state === 'suspended') ctx.resume();

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = isFinal ? 'square' : 'sine';
                    osc.frequency.setValueAtTime(isFinal ? 880 : 440, ctx.currentTime);

                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } catch (e) {
                    console.log("Audio error:", e);
                }
            };

            const generateWorkoutForDay = (dayIdx, mode) => {
                const dayConfig = DAYS_MAP[dayIdx];
                if (!dayConfig) {
                    setCurrentWorkout([]);
                    setTotalSessionTime(0);
                    return;
                }

                let restDuration = 15;
                let miniSetReps = 8;
                let extraExercisesCount = 0;

                if (mode === "Asesino") {
                    restDuration = 5;
                    miniSetReps = 12;
                    extraExercisesCount = 2;
                } else if (mode === "Bestia") {
                    restDuration = 3;
                    miniSetReps = 15;
                    extraExercisesCount = 4;
                }

                const shuffledPool = [...EXERCISES_DATABASE].sort(() => 0.5 - Math.random());
                const usedIds = new Set();
                const usedMuscles = new Set();

                const getDiverseExercise = (mustBeNewMuscle = false) => {
                    let pool = shuffledPool.filter(ex => !usedIds.has(ex.id));
                    if (mustBeNewMuscle) {
                        const nonRepeatedMusclePool = pool.filter(ex => !usedMuscles.has(ex.muscle));
                        if (nonRepeatedMusclePool.length > 0) pool = nonRepeatedMusclePool;
                    }
                    if (pool.length === 0) pool = shuffledPool.filter(ex => !usedIds.has(ex.id));
                    if (pool.length === 0) pool = shuffledPool;

                    const chosen = pool[Math.floor(Math.random() * pool.length)];
                    usedIds.add(chosen.id);
                    usedMuscles.add(chosen.muscle);
                    return chosen;
                };

                const stdEx1 = getDiverseExercise(false);
                const stdEx2 = getDiverseExercise(true);
                const stdEx3 = getDiverseExercise(true);
                const singleEx = getDiverseExercise(true);
                const burnoutEx = getDiverseExercise(true);

                const miniSetGroup = [];
                for (let i = 0; i < 4; i++) miniSetGroup.push(getDiverseExercise(false));

                let exactSequence = [
                    { ...stdEx1, mode: "Standard", duration: 60, value: "12 reps (Halfway beep at 30s)", isRest: false },
                    { ...stdEx2, mode: "Standard", duration: 60, value: "12 reps (Halfway beep at 30s)", isRest: false },
                    { ...stdEx3, mode: "Standard", duration: 60, value: "12 reps (Halfway beep at 30s)", isRest: false },
                    { ...stdEx1, mode: "Standard", duration: 60, value: "12 reps (Halfway beep at 30s)", isRest: false },
                    { name: "Active Rest", muscle: "Pause", filename: "", mode: "Rest", duration: restDuration, value: "Catch your breath", isRest: true },
                    { ...stdEx2, mode: "Standard", duration: 60, value: "12 reps (Halfway beep at 30s)", isRest: false },
                    { ...stdEx3, mode: "Standard", duration: 60, value: "12 reps (Halfway beep at 30s)", isRest: false },
                    { name: "Active Rest", muscle: "Pause", filename: "", mode: "Rest", duration: restDuration, value: "Lower heart rate", isRest: true },
                    { ...singleEx, mode: "Max Single Set", duration: 60, value: "Muscle failure", isRest: false },
                    { name: "Active Rest", muscle: "Pause", filename: "", mode: "Rest", duration: restDuration, value: "Lower heart rate", isRest: true },
                    { 
                        name: "Simultaneous Mini-Sets", 
                        muscle: "Multi-zone", 
                        filename: "", 
                        isMiniSet: true,
                        exercises: miniSetGroup,
                        mode: "MiniSets Block", 
                        duration: 180,
