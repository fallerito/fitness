<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Session - Dynamic App</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const APP_VERSION = "v1.31";

        const RAW_VIDEOS_LIST = [
            "body_abdominal_01.mp4", "body_abdominal_02.mp4", "body_abdominal_03.mp4",
            "body_cuello_01.mp4",
            "body_gluteo_01.mp4", "body_gluteo_02.mp4",
            "body_lateral_01.mp4", "body_lateral_02.mp4",
            "body_pecho_01.mp4", "body_pecho_02.mp4",
            "body_pierna_01.mp4", "body_pierna_02.mp4", "body_pierna_03.mp4", "body_pierna_04.mp4",
            "manc_abdominal_01.mp4", "manc_abdominal_02.mp4", "manc_abdominal_03.mp4", "manc_abdominal_04.mp4",
            "manc_biceps_01.mp4", "manc_biceps_02.mp4", "manc_biceps_03.mp4", "manc_biceps_04.mp4",
            "manc_gluteo_01.mp4", "manc_gluteo_02.mp4",
            "manc_espalda_01.mp4", "manc_espalda_02.mp4", "manc_espalda_03.mp4",
            "manc_hombro_01.mp4", "manc_hombro_02.mp4",
            "manc_lateral_01.mp4", "manc_lateral_02.mp4",
            "manc_pecho_01.mp4", "manc_pecho_02.mp4",
            "manc_pierna_01.mp4", "manc_pierna_02.mp4", "manc_pierna_03.mp4",
            "manc_triceps_01.mp4", "manc_triceps_02.mp4", "manc_triceps_03.mp4", "manc_triceps_04.mp4"
        ];

        const FIGHTERS_CONFIG = {
            "Flat": {
                name: "Flat",
                avatarImg: "avatares/flat.jpg",
                bgColor: "from-sky-600 to-blue-900",
                borderColor: "border-sky-400"
            },
            "Random": {
                name: "Random",
                avatarImg: "avatares/random.jpg",
                bgColor: "from-purple-600 to-indigo-900",
                borderColor: "border-purple-400"
            },
            "Invitado": {
                name: "Invitado",
                avatarImg: "avatares/invitado.jpg",
                bgColor: "from-amber-600 to-orange-900",
                borderColor: "border-amber-400"
            }
        };

        const generateDatabaseFromFiles = () => {
            return RAW_VIDEOS_LIST.map((filename, index) => {
                const parts = filename.replace('.mp4', '').split('_');
                const toolType = parts[0] === 'body' ? 'Bodyweight' : 'Dumbbell';
                let rawMuscle = parts[1] || 'General';
                
                if (rawMuscle === 'culo') rawMuscle = 'gluteo';

                let mappedMuscle = rawMuscle.charAt(0).toUpperCase() + rawMuscle.slice(1);
                if (rawMuscle === 'gluteo') mappedMuscle = 'Legs';
                if (rawMuscle === 'abdominal') mappedMuscle = 'Core';
                if (rawMuscle === 'cuello' || rawMuscle === 'lateral') mappedMuscle = 'Fullbody';

                const formattedName = `${toolType} ${rawMuscle.toUpperCase()} #${parts[2] || '1'}`;

                return {
                    id: index + 1,
                    name: formattedName,
                    muscle: mappedMuscle,
                    rawMuscle: rawMuscle,
                    filename: filename,
                    tool: toolType
                };
            });
        };

        const EXERCISES_DATABASE = generateDatabaseFromFiles();

        const DAYS_MAP = {
            1: { name: "Monday", title: "Push + Mixed Core/Upper", primaryMuscles: ["Chest", "Shoulders", "Arms", "Core"] },
            3: { name: "Wednesday", title: "Pull + Hybrid Legs", primaryMuscles: ["Back", "Legs", "Arms"] },
            5: { name: "Friday", title: "Dynamic Fullbody", primaryMuscles: ["Chest", "Back", "Legs", "Fullbody"] },
            6: { name: "Saturday", title: "Express Burnout", primaryMuscles: ["Shoulders", "Arms", "Legs", "Core"] }
        };

        const MILITARY_QUOTES = [
            {
                en: "It pays to be a winner. Under pressure, you don't rise to the occasion, you sink to the level of your training.",
                es: "Vale la pena ser un ganador. Bajo presión, no asciendes a la altura de las circunstancias, sino que caes al nivel de tu entrenamiento.",
                author: "Navy SEALs"
            },
            {
                en: "The only easy day was yesterday.",
                es: "El único día fácil fue ayer.",
                author: "US Navy SEAL Motto"
            },
            {
                en: "Who dares wins.",
                es: "Quien atreve, vence.",
                author: "British SAS Motto"
            },
            {
                en: "Pain is weakness leaving the body.",
                es: "El dolor es la debilidad abandonando el cuerpo.",
                author: "Military Fitness"
            },
            {
                en: "Never quit. Your mind will quit 100 times before your body ever does.",
                es: "Nunca te rindais. Tu mente se rendirá 100 veces antes de que lo haga tu cuerpo.",
                author: "Special Operations"
            }
        ];

        const ExerciseVideo = ({ filename, className }) => {
            const [hasError, setHasError] = React.useState(false);
            const fullSrc = `videos/${filename}`;

            React.useEffect(() => {
                setHasError(false);
            }, [fullSrc]);

            if (hasError || !filename) {
                return (
                    <div className={`${className} bg-gray-800 border border-gray-700 flex flex-col items-center justify-center p-2 text-center rounded-lg`}>
                        <span className="text-xl mb-1">🎬</span>
                        <span className="text-[10px] text-gray-400 font-semibold leading-tight">Not Found</span>
                    </div>
                );
            }

            return (
                <video 
                    src={fullSrc} 
                    autoPlay 
                    loop 
                    muted 
                    playsInline 
                    className={`${className} object-cover rounded-lg`} 
                    onError={() => setHasError(true)} 
                />
            );
        };

        function App() {
            const [selectedFighter, setSelectedFighter] = React.useState("Flat");
            const [userStats, setUserStats] = React.useState(() => {
                const saved = localStorage.getItem('jeongsin_user_stats');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) {}
                }
                return { Flat: 0, Random: 0, Invitado: 0 };
            });

            const [selectedDayIndex, setSelectedDayIndex] = React.useState(() => {
                const today = new Date().getDay();
                return DAYS_MAP[today] ? today : 5;
            });

            const [currentWorkout, setCurrentWorkout] = React.useState([]);
            const [isWorkoutActive, setIsWorkoutActive] = React.useState(false);
            const [isPaused, setIsPaused] = React.useState(false);
            const [isCompleted, setIsCompleted] = React.useState(false);
            const [currentStepIndex, setCurrentStepIndex] = React.useState(0);
            
            const [isCountdownActive, setIsCountdownActive] = React.useState(false);
            const [countdownTimer, setCountdownTimer] = React.useState(5);
            const [stepTimer, setStepTimer] = React.useState(0);
            const [totalSessionTime, setTotalSessionTime] = React.useState(0);
            
            const [currentTrack, setCurrentTrack] = React.useState("pista1.mp3");
            const [selectedQuote, setSelectedQuote] = React.useState(MILITARY_QUOTES[0]);

            const audioRef = React.useRef(null);
            const audioCtxRef = React.useRef(null);

            const saveStatsToStorage = (newStats) => {
                setUserStats(newStats);
                localStorage.setItem('jeongsin_user_stats', JSON.stringify(newStats));
            };

            const recordSessionCompletion = () => {
                const updated = {
                    ...userStats,
                    [selectedFighter]: (userStats[selectedFighter] || 0) + 1
                };
                saveStatsToStorage(updated);
            };

            const playBeep = (isFinal = false) => {
                try {
                    if (!audioCtxRef.current) {
                        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    const ctx = audioCtxRef.current;
                    if (ctx.state === 'suspended') ctx.resume();

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = isFinal ? 'square' : 'sine';
                    osc.frequency.setValueAtTime(isFinal ? 880 : 440, ctx.currentTime);

                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } catch (e) {
                    console.log("Audio error:", e);
                }
            };

            const generateWorkoutForDay = (dayIdx) => {
                const dayConfig = DAYS_MAP[dayIdx];
                if (!dayConfig) {
                    setCurrentWorkout([]);
                    setTotalSessionTime(0);
                    return;
                }

                const shuffledPool = [...EXERCISES_DATABASE].sort(() => 0.5 - Math.random());
                const usedIds = new Set();
                const usedMuscles = new Set();

                const getDiverseExercise = (mustBeNewMuscle = false) => {
                    let pool = shuffledPool.filter(ex => !usedIds.has(ex.id));
                    if (mustBeNewMuscle) {
                        const nonRepeatedMusclePool = pool.filter(ex => !usedMuscles.has(ex.muscle));
                        if (nonRepeatedMusclePool.length > 0) pool = nonRepeatedMusclePool;
                    }
                    if (pool.length === 0) pool = shuffledPool.filter(ex => !usedIds.has(ex.id));
                    if (pool.length === 0) pool = shuffledPool;

                    const chosen = pool[Math.floor(Math.random() * pool.length)];
                    usedIds.add(chosen.id);
                    usedMuscles.add(chosen.muscle);
                    return chosen;
                };

                const stdEx1 = getDiverseExercise(false);
                const stdEx2 = getDiverseExercise(true);
                const stdEx3 = getDiverseExercise(true);
                const singleEx = getDiverseExercise(true);
                const burnoutEx = getDiverseExercise(true);

                const miniSetGroup = [];
                for (let i = 0; i < 4; i++) miniSetGroup.push(getDiverseExercise(false));

                const exactSequence = [
                    { ...stdEx1, mode: "Standard", duration: 60, value: "12 reps (Halfway beep at 30s)", isRest: false },
                    { ...stdEx2, mode: "Standard", duration: 60, value: "12 reps (Halfway beep at 30s)", isRest: false },
                    { ...stdEx3, mode: "Standard", duration: 60, value: "12 reps (Halfway beep at 30s)", isRest: false },
                    { ...stdEx1, mode: "Standard", duration: 60, value: "12 reps (Halfway beep at 30s)", isRest: false },
                    { name: "Active Rest", muscle: "Pause", filename: "", mode: "Rest", duration: 15, value: "Catch your breath", isRest: true },
                    { ...stdEx2, mode: "Standard", duration: 60, value: "12 reps (Halfway beep at 30s)", isRest: false },
                    { ...stdEx3, mode: "Standard", duration: 60, value: "12 reps (Halfway beep at 30s)", isRest: false },
                    { name: "Active Rest", muscle: "Pause", filename: "", mode: "Rest", duration: 15, value: "Lower heart rate", isRest: true },
                    { ...singleEx, mode: "Max Single Set", duration: 60, value: "Muscle failure", isRest: false },
                    { name: "Active Rest", muscle: "Pause", filename: "", mode: "Rest", duration: 15, value: "Lower heart rate", isRest: true },
                    { 
                        name: "Simultaneous Mini-Sets", 
                        muscle: "Multi-zone", 
                        filename: "", 
                        isMiniSet: true,
                        exercises: miniSetGroup,
                        mode: "MiniSets Block", 
                        duration: 180, 
                        value: "8 reps per exercise", 
                        isRest: false 
                    },
                    { name: "Final Rest", muscle: "Pause", filename: "", mode: "Rest", duration: 15, value: "Last breather", isRest: true },
                    { ...burnoutEx, mode: "Final Burnout", duration: 60, value: "Give everything you have left!", isRest: false }
                ];

                setCurrentWorkout(exactSequence);
                const totalSecs = exactSequence.reduce((acc, curr) => acc + curr.duration + 5, 0);
                setTotalSessionTime(totalSecs);
            };

            React.useEffect(() => {
                generateWorkoutForDay(selectedDayIndex);
            }, [selectedDayIndex]);

            React.useEffect(() => {
                if (audioRef.current && isWorkoutActive && !isPaused) {
                    audioRef.current.volume = (isCountdownActive || stepTimer <= 3) ? 0.3 : 0.7;
                    audioRef.current.play().catch(e => console.log(e));
                } else if ((!isWorkoutActive || isPaused) && audioRef.current) {
                    audioRef.current.pause();
                }
            }, [isWorkoutActive, isPaused, isCountdownActive, stepTimer]);

            React.useEffect(() => {
                let interval = null;
                if (isWorkoutActive && !isPaused && isCountdownActive && countdownTimer > 0) {
                    interval = setInterval(() => {
                        setCountdownTimer(prev => prev - 1);
                        setTotalSessionTime(prev => (prev > 0 ? prev - 1 : 0));
                    }, 1000);
                } else if (isWorkoutActive && !isPaused && isCountdownActive && countdownTimer === 0) {
                    setIsCountdownActive(false);
                    const currentItem = currentWorkout[currentStepIndex];
                    setStepTimer(currentItem.duration);
                }
                return () => clearInterval(interval);
            }, [isWorkoutActive, isPaused, isCountdownActive, countdownTimer, currentStepIndex, currentWorkout]);

            React.useEffect(() => {
                let interval = null;
                if (isWorkoutActive && !isPaused && !isCountdownActive && stepTimer > 0) {
                    interval = setInterval(() => {
                        setStepTimer(prev => {
                            const nextVal = prev - 1;
                            if (nextVal === 30 && !currentWorkout[currentStepIndex].isRest && !currentWorkout[currentStepIndex].isMiniSet) {
                                playBeep(false);
                            }
                            if (nextVal === 3 || nextVal === 2 || nextVal === 1) {
                                playBeep(nextVal === 1);
                            }
                            return nextVal;
                        });
                        setTotalSessionTime(prev => (prev > 0 ? prev - 1 : 0));
                    }, 1000);
                } else if (isWorkoutActive && !isPaused && !isCountdownActive && stepTimer === 0) {
                    if (currentStepIndex < currentWorkout.length - 1) {
                        const nextIndex = currentStepIndex + 1;
                        setCurrentStepIndex(nextIndex);
                        setCountdownTimer(5);
                        setIsCountdownActive(true);
                    } else {
                        setIsWorkoutActive(false);
                        setIsCompleted(true);
                        recordSessionCompletion();
                        if (audioRef.current) audioRef.current.pause();
                        setSelectedQuote(MILITARY_QUOTES[Math.floor(Math.random() * MILITARY_QUOTES.length)]);
                    }
                }
                return () => clearInterval(interval);
            }, [isWorkoutActive, isPaused, isCountdownActive, stepTimer, currentStepIndex, currentWorkout]);

            const startWorkout = () => {
                if (currentWorkout.length === 0) return;
                const randomTrackNum = Math.floor(Math.random() * 9) + 1;
                setCurrentTrack(`pista${randomTrackNum}.mp3`);

                setIsCompleted(false);
                setIsPaused(false);
                setCurrentStepIndex(0);
                setCountdownTimer(5);
                setIsCountdownActive(true);
                setIsWorkoutActive(true);

                setTimeout(() => {
                    if (audioRef.current) {
                        audioRef.current.load();
                        audioRef.current.currentTime = 0;
                        audioRef.current.volume = 0.7;
                        audioRef.current.play().catch(e => console.log(e));
                    }
                }, 100);
            };

            const stopWorkout = () => {
                setIsWorkoutActive(false);
                setIsPaused(false);
                setIsCountdownActive(false);
                setIsCompleted(false);
                if (audioRef.current) audioRef.current.pause();
                generateWorkoutForDay(selectedDayIndex);
            };

            const formatMinutes = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };

            const sortedRank = Object.entries(userStats).sort((a, b) => b[1] - a[1]);
            const firstScore = sortedRank[0]?.[1] || 0;
            const tiedFighters = sortedRank.filter(([name, score]) => score === firstScore && score > 0);
            const isTie = tiedFighters.length > 1;

            const activeExercise = currentWorkout[currentStepIndex];
            const currentDayName = DAYS_MAP[selectedDayIndex]?.name || "Rest Day";

            return (
                <div className="max-w-3xl mx-auto p-3">
                    <audio ref={audioRef} src={`musica/${currentTrack}`} loop />

                    <div className="relative bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 py-2.5 px-4 rounded-xl shadow-md mb-3 flex items-center justify-between border border-blue-400/30">
                        <div>
                            <span className="text-[9px] uppercase tracking-widest text-blue-200 font-bold block">Performance Program</span>
                            <h1 className="text-lg font-black text-white tracking-wide leading-none drop-shadow-sm">
                                WORKOUT SESSION
                            </h1>
                        </div>
                        <span className="bg-black/30 text-gray-300 text-[9px] font-mono px-2 py-0.5 rounded-full border border-white/10">
                            {APP_VERSION}
                        </span>
                    </div>

                    {!isWorkoutActive && !isCompleted && (
                        <>
                            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 mb-3 shadow-md">
                                <span className="text-xs text-blue-400 font-bold uppercase tracking-wider block mb-2">Select Fighter Profile</span>
                                <div className="grid grid-cols-3 gap-2">
                                    {Object.keys(FIGHTERS_CONFIG).map((fighterKey) => {
                                        const fighter = FIGHTERS_CONFIG[fighterKey];
                                        const isSelected = selectedFighter === fighterKey;
                                        return (
                                            <button
                                                key={fighterKey}
                                                onClick={() => setSelectedFighter(fighterKey)}
                                                className={`p-2.5 rounded-xl border flex flex-col items-center justify-center transition gap-1 ${isSelected ? `bg-gradient-to-b ${fighter.bgColor}${fighter.borderColor} ring-2 ring-white/50 shadow-lg scale-105` : 'bg-gray-900 border-gray-700 hover:border-gray-500'}`}
                                            >
                                                <img src={fighter.avatarImg} alt={fighter.name} className="w-10 h-10 object-cover rounded-full border border-white/20 shadow" />
                                                <span className="font-bold text-xs text-white">{fighter.name}</span>
                                                <span className="text-[10px] text-gray-300 font-mono">Sessions: {userStats[fighterKey] || 0}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 mb-3 flex flex-col md:flex-row justify-between items-center gap-3">
                                <div>
                                    <span className="text-xs text-blue-400 font-bold uppercase tracking-wider">Active Fighter: <strong className="text-amber-400">{selectedFighter}</strong></span>
                                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                        📅 {currentDayName} 
                                    </h2>
                                    <p className="text-xs text-gray-400">{DAYS_MAP[selectedDayIndex]?.title}</p>
                                </div>

                                <div className="flex flex-col items-end">
                                    <label className="text-xs text-gray-400 mb-1">Change day manually:</label>
                                    <select 
                                        value={selectedDayIndex} 
                                        onChange={(e) => setSelectedDayIndex(Number(e.target.value))}
                                        className="bg-gray-900 text-white border border-gray-700 rounded p-1.5 text-xs focus:outline-none focus:border-blue-500">
                                        <option value={1}>Monday (Push + Core)</option>
                                        <option value={3}>Wednesday (Pull + Legs)</option>
                                        <option value={5}>Friday (Dynamic Fullbody)</option>
                                        <option value={6}>Saturday (Express Burnout)</option>
                                    </select>
                                </div>
                            </div>

                            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700 mb-4">
                                <h3 className="text-xs text-amber-400 font-bold uppercase tracking-widest mb-3 text-center">🏆 Escuela JeongSin Ranking Podium</h3>
                                <div className="grid grid-cols-3 gap-3 text-center">
                                    {sortedRank.map(([name, count], index) => {
                                        const fighter = FIGHTERS_CONFIG[name];
                                        const medals = ["🥇", "🥈", "🥉"];
                                        return (
                                            <div key={name} className="bg-gray-900/90 border border-gray-700 p-3 rounded-xl flex flex-col items-center justify-between shadow-inner">
                                                <span className="text-lg mb-1">{medals[index]}</span>
                                                <img src={fighter.avatarImg} alt={name} className="w-10 h-10 object-cover rounded-full border border-white/20 mb-1 shadow" />
                                                <span className="text-xs font-bold text-white">{name}</span>
                                                <span className="text-xs text-green-400 font-mono font-bold">{count} sessions</span>
                                            </div>
                                        );
                                    })}
                                </div>

                                {isTie && (
                                    <div className="mt-4 p-3 bg-red-950/40 border border-red-500/50 rounded-xl text-center relative overflow-hidden">
                                        <span className="text-[10px] uppercase font-mono tracking-widest text-red-400 font-bold block mb-2">⚡ Clash of Titans (Empate Detectado) ⚡</span>
                                        <div className="flex items-center justify-center gap-6 py-2">
                                            {tiedFighters.map(([name], idx) => {
                                                const fighter = FIGHTERS_CONFIG[name];
                                                return (
                                                    <div key={name} className={`flex items-center gap-2 animate-bounce ${idx === 0 ? 'flex-row' : 'flex-row-reverse'}`}>
                                                        <img src={fighter.avatarImg} alt={name} className="w-11 h-11 object-cover rounded-full border-2 border-red-400 shadow-[0_0_10px_rgba(239,68,68,0.8)]" />
                                                        <span className="text-xs font-black text-white">{name}</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        <p className="text-[10px] text-gray-300 mt-1">¡Combaten cara a cara por el liderazgo absoluto de la sesión!</p>
                                    </div>
                                )}
                            </div>
                        </>
                    )}

                    {isCompleted ? (
                        <div className="bg-gradient-to-br from-gray-800 via-gray-900 to-black p-8 rounded-2xl border-2 border-amber-500 shadow-2xl text-center animate-fadeIn">
                            <div className="mb-4">
                                <span className="text-6xl">🎖️</span>
                            </div>
                            
                            <h2 className="text-3xl md:text-4xl font-black text-amber-400 tracking-wide uppercase drop-shadow-[0_2px_10px_rgba(245,158,11,0.5)] mb-2">
                                ¡¡¡Máximo Esfuerzo Escuela JeongSin!!!
                            </h2>
                            <p className="text-sm text-green-400 font-mono font-bold mb-6">¡Sesión registrada para el luchador: {selectedFighter}!</p>

                            <div className="bg-gray-800/80 border border-amber-500/40 p-6 rounded-xl mb-6 shadow-inner text-left max-w-xl mx-auto">
                                <span className="text-xs font-mono text-amber-300 uppercase tracking-widest block mb-2 font-bold">
                                    Special Forces Motivation ({selectedQuote.author})
                                </span>
                                <p className="text-base md:text-lg text-gray-100 italic mb-4 font-serif">
                                    "{selectedQuote.en}"
                                </p>
                                <div className="border-t border-gray-700 pt-3">
                                    <p className="text-sm md:text-base text-blue-300 font-medium">
                                        "{selectedQuote.es}"
                                    </p>
                                </div>
                            </div>

                            <button 
                                onClick={() => setIsCompleted(false)}
                                className="bg-amber-600 hover:bg-amber-500 text-white px-8 py-3 rounded-xl font-bold transition shadow-lg tracking-wide uppercase text-sm">
                                Volver al Panel Principal
                            </button>
                        </div>
                    ) : isWorkoutActive && activeExercise ? (
                        <div className="p-3.5 rounded-xl border shadow-2xl text-center bg-gray-800 border-blue-500">
                            {isCountdownActive ? (
                                <div className="py-2">
                                    <span className="text-[11px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-3 py-0.5 rounded-full font-bold uppercase tracking-wider">
                                        Playing: {currentTrack} (Prep)
                                    </span>
                                    <div className="w-32 h-32 mx-auto my-3 rounded-full bg-gradient-to-br from-amber-500 to-orange-600 flex flex-col items-center justify-center shadow-2xl border-4 border-amber-300 animate-pulse">
                                        <span className="text-4xl font-black text-white font-mono">{countdownTimer}</span>
                                        <span className="text-[9px] text-amber-100 font-bold mt-0.5 uppercase">Get Ready</span>
                                    </div>
                                    <h3 className="text-base font-bold text-white">Next: {activeExercise.name}</h3>
                                    <p className="text-[10px] text-gray-400 mt-0.5">Fighter: <strong className="text-amber-400">{selectedFighter}</strong></p>
                                </div>
                            ) : (
                                <div>
                                    <div className="flex justify-between items-center mb-1.5 text-xs">
                                        <span className="bg-blue-900 text-blue-200 px-2 py-0.5 rounded-full font-bold">
                                            Step {currentStepIndex + 1}/{currentWorkout.length}
                                        </span>
                                        <span className="bg-purple-900 text-purple-200 px-2 py-0.5 rounded-full font-bold">
                                            ⏱️ Rem: {formatMinutes(totalSessionTime)}
                                        </span>
                                        <span className="px-2 py-0.5 rounded-full font-bold bg-yellow-900/60 text-yellow-300 border border-yellow-500/30">
                                            🎵 {currentTrack}
                                        </span>
                                    </div>

                                    {activeExercise.isMiniSet ? (
                                        <div className="relative w-44 h-44 mx-auto mb-1.5 grid grid-cols-2 gap-1 p-1 bg-gray-900 rounded-xl border border-purple-500/50 shadow-inner">
                                            {activeExercise.exercises.map((ex, i) => (
                                                <div key={i} className="w-full h-full rounded-lg overflow-hidden border border-gray-700 bg-black">
                                                    <ExerciseVideo filename={ex.filename} className="w-full h-full" />
                                                </div>
                                            ))}
                                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                                <div className="w-14 h-14 rounded-full bg-purple-600/90 border-4 border-purple-300 flex items-center justify-center shadow-2xl animate-bounce">
                                                    <span className="text-2xl font-black text-white font-mono">8</span>
                                                </div>
                                            </div>
                                        </div>
                                    ) : !activeExercise.isRest ? (
                                        <div className="w-40 h-40 mx-auto rounded-xl bg-gray-900 p-1 mb-1.5 border border-gray-700 flex items-center justify-center shadow-inner overflow-hidden">
                                            <ExerciseVideo filename={activeExercise.filename} className="w-full h-full" />
                                        </div>
                                    ) : (
                                        <div className="w-40 h-40 mx-auto rounded-xl bg-blue-900/20 p-1 mb-1.5 border border-blue-500/50 flex flex-col items-center justify-center shadow-inner">
                                            <span className="text-3xl mb-1">🧘‍♂️</span>
                                            <span className="text-blue-300 font-bold text-sm">REST TIME</span>
                                            <span className="text-[10px] text-blue-200">Catch your breath</span>
                                        </div>
                                    )}

                                    <h2 className="text-base font-bold text-white leading-tight">{activeExercise.name}</h2>
                                    <p className="text-[10px] text-gray-400 mb-0.5">Zone: <strong className="text-blue-400">{activeExercise.muscle}</strong></p>
                                    <p className="text-xs text-gray-300 mb-1.5">Instruction: <strong className="text-yellow-400">{activeExercise.value}</strong></p>

                                    <div className="bg-gray-900 py-2 px-3 rounded-lg border border-gray-700 inline-block w-full max-w-xs mb-2">
                                        <span className="text-[10px] text-gray-400 block mb-0.5">{activeExercise.isRest ? 'Remaining rest:' : 'Remaining time:'}</span>
                                        <span className={`text-2xl font-mono font-bold ${activeExercise.isRest ? 'text-blue-400' : 'text-green-400'}`}>{stepTimer}s</span>
                                    </div>
                                </div>
                            )}

                            <div className="flex justify-center gap-3">
                                <button 
                                    onClick={() => setIsPaused(!isPaused)}
                                    className={`px-5 py-1.5 rounded-lg font-bold text-xs transition ${isPaused ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-gray-700 hover:bg-gray-600 text-gray-200'}`}>
                                    {isPaused ? '▶️ Resume' : '⏸️ Pause'}
                                </button>
                                <button 
                                    onClick={stopWorkout}
                                    className="bg-red-600/80 hover:bg-red-500 text-white px-5 py-1.5 rounded-lg font-bold text-xs transition">
                                    Stop Workout
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="bg-gray-800 p-4 rounded-xl border border-gray-700">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-3">
                                <div>
                                    <h3 className="text-base font-bold">Scheduled Sequence ({selectedFighter})</h3>
                                    <span className="text-xs text-gray-400 block">Total Duration: <strong className="text-green-400">{formatMinutes(totalSessionTime)} min</strong></span>
                                </div>
                                {DAYS_MAP[selectedDayIndex] && (
                                    <button 
                                        onClick={startWorkout}
                                        className="bg-green-600 hover:bg-green-500 text-white px-6 py-2.5 rounded-xl font-bold transition flex items-center gap-2 shadow-lg text-sm">
                                        ▶️ Start Workout Session
                                    </button>
                                )}
                            </div>

                            <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
                                {currentWorkout.map((ex, idx) => (
                                    <div key={idx} className={`p-2.5 rounded-lg border flex justify-between items-center gap-3 ${ex.isRest ? 'bg-blue-950/20 border-blue-900/50' : 'bg-gray-900 border-gray-800'}`}>
                                        <div className="flex items-center gap-2.5">
                                            <span className="bg-amber-500/20 text-amber-400 text-[9px] px-1.5 py-0.5 rounded border border-amber-500/30 font-bold whitespace-nowrap">⏱️ 5s Pre</span>
                                            
                                            {ex.isMiniSet ? (
                                                <div className="w-10 h-10 rounded bg-purple-950 p-1 flex-shrink-0 border border-purple-700 flex items-center justify-center text-purple-300 font-bold text-xs">
                                                    🔲 x4
                                                </div>
                                            ) : !ex.isRest ? (
                                                <div className="w-10 h-10 rounded bg-gray-800 p-1 flex-shrink-0 border border-gray-700 overflow-hidden">
                                                    <ExerciseVideo filename={ex.filename} className="w-full h-full" />
                                                </div>
                                            ) : (
                                                <div className="w-10 h-10 rounded bg-blue-900/30 p-1 flex-shrink-0 border border-blue-700/50 flex items-center justify-center text-blue-300 font-bold text-xs">
                                                    💤
                                                </div>
                                            )}
                                            <div>
                                                <h4 className="font-bold text-xs">{ex.name}</h4>
                                                <span className="text-[11px] text-gray-400">{ex.muscle} • {ex.value} • <strong className="text-green-400">{ex.duration}s</strong></span>
                                            </div>
                                        </div>
                                        <span className={`text-[10px] border px-2 py-0.5 rounded font-semibold whitespace-nowrap ${ex.isRest ? 'bg-blue-950 text-blue-300 border-blue-800' : 'bg-gray-800 text-yellow-400 border-gray-700'}`}>
                                            {ex.mode}
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
